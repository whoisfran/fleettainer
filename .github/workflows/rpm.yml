name: Build RPM

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write # to attach the .rpm to the release

jobs:
  rpm:
    runs-on: ubuntu-latest
    # Build inside Fedora so the binary links against the same libraries
    # (glibc, wayland, xkbcommon…) the .rpm will find when installed.
    container: fedora:latest
    steps:
      - name: Install system dependencies
        run: |
          dnf install -y git gcc gcc-c++ clang cmake make pkgconf-pkg-config rpm-build \
            libxkbcommon-devel libxkbcommon-x11-devel wayland-devel \
            libxcb-devel libX11-devel vulkan-loader-devel \
            fontconfig-devel freetype-devel openssl-devel

      - uses: actions/checkout@v4

      # Single source of truth: `version` in Cargo.toml. It is the version the app
      # shows in its status bar and the one cargo-generate-rpm puts in the .rpm
      # (fleettainer-0.2.0-1.x86_64.rpm).
      - name: Read version from Cargo.toml
        id: version
        run: echo "version=$(grep -m1 '^version' Cargo.toml | cut -d '"' -f2)" >> "$GITHUB_OUTPUT"

      # On a tag, it must match Cargo.toml (tag v0.2.0 ⇔ version = "0.2.0").
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME#v}" != "${{ steps.version.outputs.version }}" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-generate-rpm
        run: cargo install cargo-generate-rpm --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Build .rpm
        run: cargo generate-rpm

      - uses: actions/upload-artifact@v4
        with:
          name: fleettainer-${{ steps.version.outputs.version }}-rpm
          path: target/generate-rpm/*.rpm

      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Fleettainer v${{ steps.version.outputs.version }}
          files: target/generate-rpm/*.rpm
